[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-firewall"
version = "0.1.1"
description = "A local-first research framework for inspecting data before AI/LLM calls."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Manu Faujdar"}]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.urls]
Documentation = "https://github.com/manufaujdar/ai-firewall#readme"
Issues = "https://github.com/manufaujdar/ai-firewall/issues"
Source = "https://github.com/manufaujdar/ai-firewall"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_firewall"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
