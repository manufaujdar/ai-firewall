version: 1
default_action: block
allowed_hosts:
  - api.openai.com
  - api.anthropic.com
  - generativelanguage.googleapis.com

rules:
  - id: private_key
    description: PEM-encoded private key material
    pattern: "-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
    action: block
    severity: critical

  - id: cloud_access_key
    description: Common cloud access-key identifier
    pattern: "\\b(?:AKIA|ASIA)[A-Z0-9]{16}\\b"
    action: block
    severity: critical

  - id: generic_secret
    description: Secret-like assignment in text or source code
    pattern: "(?i)\\b(?:api[_-]?key|secret|password|token)\\s*[:=]\\s*[\\\"']?[A-Za-z0-9_./+\\-=]{12,}"
    action: block
    severity: high

  - id: payment_card
    description: Possible payment-card number (validated with Luhn)
    pattern: "(?<!\\d)(?:\\d[ -]?){13,19}(?!\\d)"
    validator: luhn
    action: block
    severity: high

  - id: email
    description: Email address
    pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
    action: redact
    severity: medium

  - id: indian_pan
    description: Indian Permanent Account Number
    pattern: "\\b[A-Z]{5}[0-9]{4}[A-Z]\\b"
    action: redact
    severity: high
